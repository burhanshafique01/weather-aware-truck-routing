# One-click deploy: https://render.com/deploy?repo=<this repository URL>
services:
  - type: web
    name: weather-aware-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
