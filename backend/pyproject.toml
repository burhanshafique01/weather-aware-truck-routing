[project]
name = "weather-aware-truck-routing"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"routing/tests/*" = ["E501"]
