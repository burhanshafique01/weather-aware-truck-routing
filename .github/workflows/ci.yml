name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff==0.8.4
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Tests
        run: python manage.py test routing -v 2

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t weather-aware-truck-routing .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name app -e DJANGO_ALLOWED_HOSTS=localhost weather-aware-truck-routing
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health/ && break; sleep 1; done
          curl -fsS http://localhost:8000/ | grep -q "Weather-Aware Truck Routing"
